# Local LiveKit media server for development.
# Run with:  docker compose up
#
# Port mappings (rather than host networking) so this works on macOS, Windows,
# and Linux alike. 7880 = signaling/WS, 7881 = TCP fallback, 50000-50100/udp =
# the media (RTP) range that carries actual audio.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
